name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  relay:
    name: Relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # 只有 Wrangler（部署预演）还要 Node：Cloudflare 官方只支持用 Node 运行 Wrangler
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Protocol Contract Drift
        run: bun run protocol:check
      - run: bun run build:relay
      - run: bun run lint:relay
      - run: bun run test:relay
      - run: bun run --cwd apps/relay test:coverage
      - run: bun run deploy:relay:dry-run

  agent:
    name: Agent
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - run: DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer bun run lint:agent
      - name: SwiftPM Tests
        run: DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer bash apps/agent/scripts/test.sh swiftpm
      - name: Native Xcode Tests
        run: DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer bash apps/agent/scripts/test.sh native
      - run: bun run build:agent
